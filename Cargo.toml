[workspace]
resolver = "3"
members = ["crates/manifest-cli", "crates/protocol", "crates/verifier"]

[workspace.package]
edition = "2024"
rust-version = "1.87"
repository = "https://github.com/Rohanarora17/pir"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
