[package]
name = "pvrpc-verifier-comparison"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
default-run = "pvrpc-verifier-comparison"

# This experiment compares candidates without changing the production workspace dependencies.
[workspace]
resolver = "3"

[dependencies]
alloy-primitives = { version = "1", default-features = false, features = ["std", "rlp"] }
alloy-rlp = "0.3"
alloy-trie = { version = "=0.9.8", default-features = false, features = ["std", "ethereum"] }
eth_trie = "=0.6.1"
serde_json = "1"
